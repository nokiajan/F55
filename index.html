<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F55</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

.image-container {
    position: fixed;
    inset: 0;
}

.image-container img {
    position: absolute;
    inset: 0;
    margin: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;

    opacity: 0;
    transition: opacity 1.5s ease-in-out;
}

.image-container img.active {
    opacity: 1;
}
</style>
</head>

<body>

<div class="image-container">
    <img src="zoir1.png" class="active">
    <img src="zoir2.png">
    <img src="zoir3.png">
    <img src="zoir4.png">
    <img src="zoir5.png">
    <img src="zoir6.png">
</div>

<script>
const images = document.querySelectorAll('.image-container img');
let current = 0;
const delay = 6000; // 6 секунд на картинку

setInterval(() => {
    images[current].classList.remove('active');
    current = (current + 1) % images.length;
    images[current].classList.add('active');
}, delay);
</script>

</body>
</html>

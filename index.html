<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F55</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

.image-container {
    position: fixed;
    inset: 0;
}

.image-container img {
    position: absolute;
    inset: 0;
    margin: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 0;
    animation: fade 36s infinite;
}

/* Задержки для каждого изображения */
.image-container img:nth-child(1) { animation-delay: 0s; }
.image-container img:nth-child(2) { animation-delay: 6s; }
.image-container img:nth-child(3) { animation-delay: 12s; }
.image-container img:nth-child(4) { animation-delay: 18s; }
.image-container img:nth-child(5) { animation-delay: 24s; }
.image-container img:nth-child(6) { animation-delay: 30s; }

@keyframes fade {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    25%  { opacity: 1; }
    35%  { opacity: 0; }
    100% { opacity: 0; }
}
</style>
</head>

<body>

<div class="image-container">
    <img src="zoir1.png" alt="Image 1">
    <img src="zoir2.png" alt="Image 2">
    <img src="zoir3.png" alt="Image 3">
    <img src="zoir4.png" alt="Image 4">
    <img src="zoir5.png" alt="Image 5">
    <img src="zoir6.png" alt="Image 6">
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F55 — IK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .slideshow {
      position: fixed;
      inset: 0;
      background: #000;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Предзагрузка изображений */
    .preload {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="slideshow">
    <div class="slide active" style="background-image: url('zoir1.png');"></div>
    <div class="slide" style="background-image: url('zoir2.png');"></div>
    <div class="slide" style="background-image: url('zoir3.png');"></div>
    <div class="slide" style="background-image: url('zoir4.png');"></div>
    <div class="slide" style="background-image: url('zoir5.png');"></div>
    <div class="slide" style="background-image: url('zoir6.png');"></div>
  </div>

  <!-- Предзагрузка изображений -->
  <div class="preload">
    <img src="zoir1.png" alt="">
    <img src="zoir2.png" alt="">
    <img src="zoir3.png" alt="">
    <img src="zoir4.png" alt="">
    <img src="zoir5.png" alt="">
    <img src="zoir6.png" alt="">
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    let currentIndex = 0;

    const showNextSlide = () => {
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % totalSlides;
      slides[currentIndex].classList.add('active');
    };

    // Запускаем слайд-шоу
    setInterval(showNextSlide, 20000);

    // Если хочешь добавить паузу при наведении курсора (опционально)

      // clearInterval(interval); // если используешь interval
    });
    slideshow.addEventListener('mouseleave', () => {
      // interval = setInterval(showNextSlide, 6000);
    });
    */
  </script>
</body>
</html>
